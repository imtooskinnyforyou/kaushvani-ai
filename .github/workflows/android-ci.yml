name: KAARIGAR Android CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK/Bundle build variant to generate'
        required: true
        default: 'both'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'
      run_roborazzi:
        description: 'Run Roborazzi screenshot verification'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ============================================================================
  # 1. CODE QUALITY & LINT VERIFICATION
  # ============================================================================
  code-quality-and-lint:
    name: Code Quality & Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache & Toolchain
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Environment File
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Run Android Lint (Debug)
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:lintDebug --stacktrace
          else
            gradle :app:lintDebug --stacktrace
          fi

      - name: Upload Android Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

  # ============================================================================
  # 2. UNIT & ROBOLECTRIC TEST SUITE
  # ============================================================================
  unit-and-robolectric-tests:
    name: Unit & Robolectric Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache & Toolchain
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Environment File & Keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # Decode debug keystore if present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from base64"
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Run JVM & Robolectric Unit Tests
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:testDebugUnitTest --continue --stacktrace
          else
            gradle :app:testDebugUnitTest --continue --stacktrace
          fi

      - name: Run Roborazzi Screenshot Verification (Optional)
        if: ${{ inputs.run_roborazzi == true }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:verifyRoborazziDebug --stacktrace
          else
            gradle :app:verifyRoborazziDebug --stacktrace
          fi

      - name: Upload Test Results & HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

  # ============================================================================
  # 3. ASSEMBLE APK & AAB ARTIFACTS
  # ============================================================================
  build-apk-and-bundle:
    name: Assemble APK & Android App Bundle (AAB)
    needs: [code-quality-and-lint, unit-and-robolectric-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache & Toolchain
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keys & Environment Secrets
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Configure .env with secret key if available in repository secrets
          if [ -n "$GEMINI_SECRET" ]; then
            echo "GEMINI_API_KEY=$GEMINI_SECRET" > .env
          else
            cp .env.example .env
          fi

          # Prepare debug keystore
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Prepare release keystore if provided in GitHub Secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "RELEASE_KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "RELEASE_KEYSTORE_READY=false" >> $GITHUB_ENV
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' || inputs.build_type == '' }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Build Release APK & Bundle (AAB)
        if: ${{ (inputs.build_type == 'release' || inputs.build_type == 'both' || inputs.build_type == '') && env.RELEASE_KEYSTORE_READY == 'true' }}
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          else
            gradle :app:assembleRelease :app:bundleRelease --stacktrace
          fi

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaarigar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK & Bundle Artifacts
        if: ${{ env.RELEASE_KEYSTORE_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kaarigar-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Generate GitHub Step Summary
        run: |
          echo "## 🚀 KAARIGAR CI/CD Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check / Artifact | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android Lint** | ✅ Passed | Code quality & style verified |" >> $GITHUB_STEP_SUMMARY
          echo "| **Unit & Robolectric Tests** | ✅ Passed | All unit tests completed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Debug APK** | 📦 Generated | Ready for testing & QA distribution |" >> $GITHUB_STEP_SUMMARY
          if [ "$RELEASE_KEYSTORE_READY" = "true" ]; then
            echo "| **Release APK & AAB** | 🔒 Signed | Ready for Google Play Store upload |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Release Signing** | ℹ️ Skipped | Add \`KEYSTORE_BASE64\` to GitHub Secrets for signed release APK |" >> $GITHUB_STEP_SUMMARY
          fi
